<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Studio</title>
  <script>
    (function() {
      try {
        var cat = sessionStorage.getItem('activeCategory') || 'looks';
        document.documentElement.setAttribute('data-initial-category', cat);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo" style="background: transparent; overflow: hidden;">
          <img src="assets/icon.png" alt="Theme Studio" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">
        </div>
        <div class="brand-info">
          <span class="brand-title">Theme Studio</span>
          <span class="brand-subtitle">Linux Customizer</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">CUSTOMIZE</div>
        <button class="nav-item" data-category="looks">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          </svg>
          <span>Looks</span>
        </button>

        <button class="nav-item" data-category="gtk-theme">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            <path d="M3 9h18"></path>
            <path d="M9 21V9"></path>
          </svg>
          <span>GTK Themes</span>
        </button>

        <button class="nav-item" data-category="shell-theme">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="5" rx="2"></rect>
            <line x1="2" x2="22" y1="10" y2="10"></line>
          </svg>
          <span>Shell Themes</span>
        </button>

        <button class="nav-item" data-category="icon-theme">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="7" x="3" y="3" rx="1"></rect>
            <rect width="7" height="7" x="14" y="3" rx="1"></rect>
            <rect width="7" height="7" x="14" y="14" rx="1"></rect>
            <rect width="7" height="7" x="3" y="14" rx="1"></rect>
          </svg>
          <span>Icons</span>
        </button>

        <button class="nav-item" data-category="cursor-theme">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
            <path d="m13 13 6 6"></path>
          </svg>
          <span>Cursors</span>
        </button>

        <button class="nav-item" data-category="wallpaper">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            <circle cx="9" cy="9" r="2"></circle>
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
          </svg>
          <span>Wallpapers</span>
        </button>

        <button class="nav-item" data-category="extensions">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
          </svg>
          <span>Extensions</span>
        </button>

        <button class="nav-item" data-category="tweaks">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 21v-7"></path>
            <path d="M4 10V3"></path>
            <path d="M12 21v-9"></path>
            <path d="M12 8V3"></path>
            <path d="M20 21v-5"></path>
            <path d="M20 12V3"></path>
            <path d="M1 14h6"></path>
            <path d="M9 8h6"></path>
            <path d="M17 16h6"></path>
          </svg>
          <span>Tweaks</span>
        </button>

        <button class="nav-item" data-category="lockscreen">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Lock Screen</span>
        </button>

        <button class="nav-item" data-category="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="footer-btn" id="btn-reset-default" title="Reset desktop settings to standard Ubuntu default">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
          <span>Reset to Default</span>
        </button>

        <button class="footer-btn" id="btn-uninstall-mgr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            <line x1="10" x2="10" y1="11" y2="17"></line>
            <line x1="14" x2="14" y1="11" y2="17"></line>
          </svg>
          <span>Uninstall Manager</span>
        </button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-content">
      <!-- Top Bar / Header -->
      <header class="topbar">
        <div class="header-left">
          <h1 class="page-title" id="page-title">Themes</h1>
          <p class="page-subtitle" id="page-subtitle">Explore curated GTK3 and GTK4 desktop themes</p>
        </div>

        <div class="header-right">
          <!-- Search Box -->
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input type="text" id="search-input" placeholder="Search items..." autocomplete="off">
          </div>
        </div>
      </header>

      <!-- Sub-Tabs Navigation -->
      <div class="subtabs-bar">
        <div class="subtabs">
          <button class="subtab-btn" data-subtab="installed" id="tab-installed">
            <span>Installed</span>
            <span class="badge count-badge" id="installed-count">0</span>
          </button>
          <button class="subtab-btn active" data-subtab="browse" id="tab-browse">
            <span>Browse</span>
            <span class="badge count-badge" id="browse-count">0</span>
          </button>
        </div>
      </div>

      <!-- Catalog View / Grid -->
      <section class="content-scrollable">
        <div class="cards-grid" id="cards-grid">
          <!-- Cards injected via JavaScript -->
        </div>

        <!-- Empty State Container -->
        <div class="empty-state hidden" id="empty-state">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </div>
          <h3 class="empty-title" id="empty-title">No items found</h3>
          <p class="empty-desc" id="empty-desc">There are no themes available in this section.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast notification container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Components -->
  <script src="components/toast.js"></script>
  <script src="components/progress-bar.js"></script>
  <script src="components/card.js"></script>
  <script src="components/variant-picker.js"></script>
  <script src="components/confirm-dialog.js"></script>
  <!-- Views -->
  <script src="views/themes.view.js"></script>
  <script src="views/icons.view.js"></script>
  <script src="views/cursors.view.js"></script>
  <script src="views/wallpapers.view.js"></script>
  <script src="views/looks.view.js"></script>
  <script src="views/uninstall.view.js"></script>
  <script src="views/settings.view.js"></script>
  <script src="views/extensions.view.js"></script>
  <script src="views/tweaks.view.js"></script>
  <script src="views/lockscreen.view.js"></script>
  <!-- App -->
  <script src="renderer.js"></script>
</body>
</html>
